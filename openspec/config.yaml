schema: spec-driven

context: |
  Project: Nextage Class, a personal learning and portfolio project.
  Current stage: increments 1A, 1B and 1C implemented and technically verified; usage review pending.
  Baseline 1A/1B/1C specs are synced. Active change track-student-course-progress adds ordered material lessons and per-student progress through lesson records.
  Read docs/decisions.md for validated decisions and docs/roadmap.md for scope.
  Frontend: React, TypeScript, Vite. Later backend: C#, ASP.NET Core, PostgreSQL.
  Initial scope: one teacher, adult students, individual lessons, one reference timezone.
  First demo uses fictitious data persisted in the browser; real accounts come later.
  AI assists software development only; AI product features are out of scope.
  Cristian guides decisions and validates results; the AI assistant implements and verifies.
  Do not assign programming exercises to Cristian unless he asks for them.
  Product documentation and UI text start in Portuguese; technical identifiers use English.
  Collaboration follows docs/development-workflow.md and AGENTS.md.

rules:
  proposal:
    - Keep scope small and identify the roadmap increment.
    - Separate validated decisions from open questions; do not invent answers.
  specs:
    - Use the OpenSpec requirement/scenario structure with verifiable scenarios.
    - Keep planned behavior in change specs until it is implemented and validated.
  design:
    - Explain relevant tradeoffs and avoid infrastructure for distant future features.
  tasks:
    - Split work into reviewable outcomes that Cristian can follow; the AI assistant implements and verifies.
    - Include focused verification and practical acceptance for relevant behavior.
