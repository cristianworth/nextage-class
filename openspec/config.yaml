schema: spec-driven

context: |
  Project: Nextage Class, a personal learning and portfolio project.
  Current stage: teacher demo complete; Nara approved usage review 1F as reported by Cristian on 2026-10-24. Local workspace format is v6, migrating v1-v5 in memory without reset or writes on read.
  Baseline includes teaching sequences (books or teacher-authored units), standalone support and flexible selection without presumed completion. Stages 1 and 2 are complete and changes archived. Cristian confirmed the integrated usage review with Nara on 2026-10-25. Student consultation shares used material and homework only; free lesson notes, absence reasons and preparation are excluded. Previous-level catalog access is limited to used-material snapshots in history. Reading catalog items does not change progress or mark completion. Students can combine independent one-off and weekly requests; each requires teacher approval, pending requests do not reserve time, and approval rechecks conflicts across the full requested period. Stage 3A-3E adds server, identity, authorization, persistence and operational recovery. Accounts use teacher invitations and email/password without public registration, confirmed by Cristian. Homework stays unchanged.
  Cristian authorized continuous implementation following the roadmap on 2026-10-25. Reassess after each stage, every three chunks and new material findings; update affected planning before continuing. Ask for user insight with a recommendation for material ambiguity, user-dependent choices or repeated lack of progress. Conditional future stages do not become mandatory scope automatically.
  Read docs/decisions.md for validated decisions and docs/roadmap.md for scope.
  Frontend: React, TypeScript, Vite. Stage 3A server foundation is executable: C#/ASP.NET Core with SDK 10.0.402 and Npgsql 10.0.3, PostgreSQL 18.6 verified locally. Health checks use actual database connectivity; accounts and business operations remain subsequent work. Toolchain, database and credentials are ignored under work/. Use scripts/dotnet.ps1 and docs/server-development.md; never print private server-env.json. Demo remains independent.
  Stage 3B provider decision: Cristian selected Supabase for hosted PostgreSQL and Auth to reduce credential implementation. Do not add ASP.NET Core Identity or store duplicate passwords. A separate Free project Nextage Class was created in Sao Paulo after organization selection and a zero-cost quote; do not modify GachaManagement. The API validates identity and authoritative account/student permissions; editable user metadata must not grant roles. Admin secrets stay server-side. Public signup, email delivery and real integration require verification before real invitations. See docs/supabase-pilot.md.
  Stage 3B progress: B1 implemented with JWT validation and active profile session. SQL migrations 001/002 create restricted app schema and are applied locally and to the separate Supabase project. Nineteen HTTP tests pass. B2 adds protected student creation/invitations; B3 adds official SDK access screens and isolated browser verification. B4 progress: admin key accepted, initial test identity bound explicitly as teacher and invitation send accepted; real activation/login/recovery remain pending. Local integration tests use nextage_class_tests, separate from the development account; do not claim the full access flow is operational. See docs/account-access.md for verified behavior and external configuration pending.
  Initial scope: one teacher, adult students, individual lessons, one reference timezone.
  First demo uses fictitious data persisted in the browser; real accounts come later.
  AI assists software development only; AI product features are out of scope.
  Cristian guides decisions and validates results; the AI assistant implements and verifies.
  Do not assign programming exercises to Cristian unless he asks for them.
  Product documentation and UI text start in Portuguese; technical identifiers use English.
  Collaboration follows docs/development-workflow.md and AGENTS.md.

rules:
  proposal:
    - Keep scope small and identify the roadmap increment.
    - Separate validated decisions from open questions; do not invent answers.
  specs:
    - Use the OpenSpec requirement/scenario structure with verifiable scenarios.
    - Keep planned behavior in change specs until it is implemented and validated.
  design:
    - Explain relevant tradeoffs and avoid infrastructure for distant future features.
  tasks:
    - Split work into reviewable outcomes that Cristian can follow; the AI assistant implements and verifies.
    - Include focused verification and practical acceptance for relevant behavior.
